<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Senha</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Esqueceu a senha?</a>
</div>
<div class="relative">
<input class="w-full h-12 px-stack-md rounded-lg border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline outline-none" id="password" placeholder="••••••••" type="password"/>

<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="pt-unit">
