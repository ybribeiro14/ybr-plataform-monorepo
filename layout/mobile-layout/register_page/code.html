<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile">
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant shadow-[0_8px_40px_rgba(152,66,7,0.06)] rounded-xl overflow-hidden">
<div class="p-8 md:p-10 flex flex-col items-center">
<div class="mb-10 text-center">
<span class="font-display-lg italic text-display-md text-primary tracking-tight">YBR Platform</span>
</div>
<div class="text-center mb-8">
<h1 class="font-title-lg text-title-lg text-on-surface mb-2">Crie sua conta</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Junte-se a mais de 800 alunas</p>
</div>
<form class="w-full space-y-6">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="name">Nome completo</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-4 font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" id="name" placeholder="Ex: Ana Silva" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">E-mail</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-4 font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" id="email" placeholder="seu@email.com" type="email"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Senha</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-4 font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" id="password" placeholder="Mínimo 8 caracteres" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="px-1 pt-2">
<div class="flex gap-1 h-1 w-full rounded-full overflow-hidden bg-outline-variant">
<div class="w-1/3 bg-primary rounded-full"></div>
<div class="w-1/3 bg-outline-variant"></div>
<div class="w-1/3 bg-outline-variant"></div>
</div>
<p class="text-[10px] font-label-md text-primary mt-1">Força da senha: Média</p>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="confirm_password">Confirmar senha</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-4 font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" id="confirm_password" placeholder="Repita sua senha" type="password"/>
</div>
<div class="flex items-start gap-3 px-1 pt-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="terms" type="checkbox"/>
</div>
<label class="font-label-md text-[12px] leading-tight text-on-surface-variant" for="terms">
                        Eu li e concordo com os <a class="text-primary hover:underline" href="#">Termos de Uso</a> e a <a class="text-primary hover:underline" href="#">Política de Privacidade</a>.
                    </label>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-button text-button py-4 rounded-full shadow-lg hover:shadow-primary/20 transition-all active:scale-[0.98]" type="submit">
                    Criar conta gratuita
                </button>
</form>
<div class="w-full flex items-center gap-4 my-8">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-md text-[12px] text-outline uppercase tracking-widest">ou entre com</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-low border border-outline-variant hover:bg-surface-container-high text-on-surface font-button text-button py-4 rounded-full transition-all" type="button">

</a>
</footer>
