<body class="antialiased min-h-screen flex flex-col items-center">
<div class="fixed inset-0 grain-overlay"></div>
<!-- Navigation Shell Suppressed as per "The Destination Rule" for Transactional Flow -->
<!-- Top Bar with Back Arrow & Logo -->
<header class="w-full max-w-7xl px-6 h-20 flex items-center justify-between z-10">
<a class="flex items-center gap-2 text-primary hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span class="font-label-md text-label-md">Voltar</span>
</a>
<div class="font-serif italic text-2xl text-primary">YBR Platform</div>
<div class="w-10"></div> <!-- Spacer to center logo if needed, or balance layout -->
</header>
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-md px-margin-mobile z-10 pb-section-gap">
<!-- Visual Anchor: Large Terracotta Envelope Icon -->
<div class="relative mb-stack-lg">
<div class="absolute inset-0 bg-primary/5 rounded-full scale-150 blur-2xl"></div>
<div class="relative bg-surface-container-low w-24 h-24 rounded-full flex items-center justify-center shadow-[0_4px_20px_rgba(152,66,7,0.08)] border border-outline-variant/30">
<span class="material-symbols-outlined text-primary !text-5xl" data-icon="mail">mail</span>
</div>
</div>
<!-- Content Section -->
<div class="text-center mb-stack-lg">
<h1 class="font-display-md text-display-md text-on-surface mb-stack-sm">Esqueceu sua senha?</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto">
                Digite seu email e enviaremos um link para redefinir sua senha com segurança.
            </p>
</div>
<!-- Form Section -->
<form class="w-full space-y-stack-md">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email cadastrado</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="alternate_email">alternate_email</span>
<input class="w-full pl-12 pr-4 py-4 rounded-lg bg-surface border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant font-body-md text-body-md" id="email" name="email" placeholder="seu@email.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary py-4 rounded-full font-button text-button hover:bg-primary-container hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4 shadow-[0_4px_12px_rgba(152,66,7,0.15)]" type="submit">
                Enviar link de recuperação
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-stack-lg text-center">
<a class="font-label-md text-label-md text-outline hover:text-primary transition-colors flex items-center gap-2 justify-center" href="#">
                Lembrou? <span class="text-primary font-bold">Voltar para o login</span>
</a>
</div>
</main>
<!-- Contextual Decorative Elements -->
<div class="fixed bottom-0 left-0 w-64 h-64 opacity-20 blur-3xl bg-primary-fixed-dim -z-10 rounded-full translate-y-1/2 -translate-x-1/2"></div>
<div class="fixed top-20 right-0 w-80 h-80 opacity-10 blur-3xl bg-tertiary-fixed -z-10 rounded-full -translate-y-1/2 translate-x-1/2"></div>
