            background-color: #fff8f6; /* Warm Cream background */

            box-shadow: 0px 4px 20px rgba(196, 99, 42, 0.08);

<body class="h-full flex items-center justify-center p-margin-mobile md:p-0">
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-stack-lg flex flex-col items-center">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center mb-stack-sm shadow-sm overflow-hidden">
<img class="w-10 h-10 object-contain" data-alt="minimalist golden circular icon representing an artisan pastry whisk with elegant swirls on a terracotta background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAF51UpTmN8QDYaj-BB7M8GeaRw1kmuWxFrQPvlbGUWeKoBurYHYhAHR4xZccPaQSq1lenYiBgA4WX4To9N0oZXkKAQtzWkFE3bA7cR9mZxgw6aibwaJZf_i2rMM9MF2jg6h62vgWIzwpaT1SknfsOYC50KfvsZ9TSLzOiaEnlG8m5uDeH5S9EBSeM9VaKYa5BPRJOjA-MqEwEh5rWQ6Q1hpuiwmR66C01b1ZcPqwg_HZOYf9ljv00s3bJqQ84ik9sjiYdBOSLD3nc"/>
</div>
<span class="font-display-md text-display-md text-primary italic">YBR</span>
</div>
<!-- Login Card -->
<div class="login-card w-full bg-white rounded-xl p-stack-lg md:p-10 flex flex-col">
<div class="text-center mb-stack-lg">
<h1 class="font-title-lg text-title-lg text-on-surface mb-2">Bem-vinda de volta</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Entre na sua conta para continuar aprendendo</p>
</div>
<form class="space-y-stack-md">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">E-mail</label>
<input class="w-full h-12 px-4 rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-surface-bright font-body-md text-on-surface transition-all" id="email" placeholder="seu@email.com" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Senha</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Esqueceu sua senha?</a>
</div>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-surface-bright font-body-md text-on-surface transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-[48px] bg-primary text-on-primary font-button text-button rounded-full hover:bg-primary-container active:scale-[0.98] transition-all shadow-md mt-stack-sm" type="submit">
                    Entrar
                </button>
</form>
<!-- Divider -->
<div class="relative my-stack-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-md">
<span class="px-4 bg-white text-on-surface-variant font-label-md">ou continue com</span>
</div>
</div>
<!-- Social Login -->
<button class="w-full h-[48px] border border-outline-variant bg-white text-on-surface font-button text-button rounded-full flex items-center justify-center gap-3 hover:bg-surface-container-low transition-all active:scale-[0.98]" type="button">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGNHP7DPci1Ccy4Wanb86ToB6f5qpjqcESUzBiFcm2MOotClydOl033dhezz_BVE3iu_ytBepXFCoBQm1oG_7avkpavZLwaMIBJrvt-khRTta4eIBUVF-YADsFqi5pE5QbL0f--OssPVo7PmcRBYSgl2v0xNwrNBSBygOTZVGz3ILm4xP-IZwnYHBVY--JSC6FfNq5pPIwWZ-x6c7S9K5TDu0waQDyAneRnOb00mMt49rq0W-UzjzaG6r9kmD1vYF3pxS2FY70ZWuN"/>
                Google
            </button>
</div>
<!-- Secondary Actions -->
<div class="mt-stack-lg text-center space-y-stack-md">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors block" href="#">
                Não tem conta? <span class="text-primary font-semibold">Crie gratuitamente →</span>
</a>
<!-- Trust Indicator -->
<div class="flex items-center justify-center gap-2 text-on-surface-variant/60">
<span class="material-symbols-outlined text-[18px]" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-md text-[12px] uppercase tracking-widest">Conexão segura SSL</span>
</div>
</div>
</main>
<!-- Visual Decorative Element (Optional refinement for a High-End feel) -->
<div class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary-container opacity-50"></div>
</body></html>
